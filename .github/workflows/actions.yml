name: CI

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install uv
          uv pip install --system --upgrade -e ".[dev]"

      - name: Show installed packages
        run: pip list

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Run tests
        run: pytest

  # The tests above run without jax, so the jax-specific ones skip there.
  # This job installs the optional extra so they actually execute. jax needs
  # a newer Python than the floor the matrix above covers.
  jax:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies with the jax extra
        run: |
          python -m pip install uv
          uv pip install --system --upgrade -e ".[dev,jax]"

      - name: Show installed packages
        run: pip list

      - name: Run tests
        run: pytest

      - name: Fail if the jax tests were skipped
        run: pytest test/test_jax_backend.py -q --no-header -p no:cacheprovider | tee /dev/stderr | grep -qE "[0-9]+ passed"
