# HAMMER is not on PyPI: it is a C++ library with a Cython wrapper, built from
# source, and the build takes long enough that it does not belong in the CI that
# every push runs. The main workflow therefore lets the tests needing it skip,
# and this one builds it and runs them, on demand and once a week.
name: HAMMER

on:
  workflow_dispatch:
  schedule:
    # Mondays, 05:00 UTC. HAMMER moves slowly; this is here to catch a release
    # that breaks the build, rather than to gate a change.
    - cron: '0 5 * * 1'
  push:
    paths:
      - 'redist/modifier_hammer.py'
      - 'test/test_hammer_*.py'
      - '.github/workflows/hammer.yml'
  pull_request:
    paths:
      - 'redist/modifier_hammer.py'
      - 'test/test_hammer_*.py'
      - '.github/workflows/hammer.yml'

env:
  HAMMER_VERSION: v1.3.0
  # Bump when the build recipe itself changes -- the patches, the cmake flags,
  # the HAMMER version. Deliberately not a hash of this file: the cache holds a
  # build, and editing which steps are conditional does not change that build.
  # Hashing the whole file meant every edit invalidated it, which is how the
  # cache-hit path stayed untested through six runs.
  HAMMER_CACHE_VERSION: '1'

jobs:
  hammer:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # HAMMER's own make runs pyext/setup.py as its last target, so setuptools
      # has to be there before the build, not after it. Nothing since Python
      # 3.12 ships it, which is what this step is for; cython and numpy are
      # what that setup.py goes on to need.
      - name: Install the build-time Python packages
        run: python -m pip install --upgrade pip wheel setuptools cython numpy

      # Everything HAMMER lives outside the checkout. Its source tree and its
      # build tree both carry Python 2 test files, from googletest and yaml-cpp,
      # and pytest collecting those from the repo root was what broke the run
      # -- with a WindowsPath error that looked like HAMMER corrupting the
      # interpreter and was nothing of the sort.
      #
      # The build is what costs; it depends only on the HAMMER version and on
      # this file, so it is kept between runs. All three directories are needed,
      # because the steps that produce them are skipped on a hit:
      #   Hammer-install  the libraries
      #   Hammer-build    pyext, pip installed into every run's fresh env
      #   Hammer          the source, which pyext/setup.py reads its README from
      # Leaving the source out looked harmless and was not: the first run that
      # ever hit this cache died in setup.py on a missing README.md.
      - name: Cache the HAMMER build
        id: hammer-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/Hammer-install
            ${{ runner.temp }}/Hammer-build
            ${{ runner.temp }}/Hammer
          key: hammer-${{ runner.os }}-${{ env.HAMMER_VERSION }}-${{ env.HAMMER_CACHE_VERSION }}

      # Not conditional on the cache. hammerlib.so links against system Boost
      # and loads it at import time, so skipping this on a hit produced a
      # HAMMER that installed fine and then could not be imported:
      #   libboost_thread.so.1.74.0: cannot open shared object file
      # The build tools are only wanted on a miss, but asking apt for all of it
      # every time is a few seconds against the five minutes the cache saves.
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libboost-all-dev

      - name: Fetch and patch the HAMMER source
        if: steps.hammer-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$HAMMER_VERSION" \
            https://gitlab.com/mpapucci/Hammer.git "$RUNNER_TEMP/Hammer"
          cd "$RUNNER_TEMP/Hammer"

          # -ansi is C++98 and the sources are not, so it has to go. Matched on
          # the flag rather than on a line number, so that a point release that
          # moves the line fails loudly here instead of patching something else.
          sed -i 's/ -ansi -D_FILE_OFFSET_BITS=64/ -D_FILE_OFFSET_BITS=64/' \
            CMakeModules/CompilerChecks.cmake
          if grep -q -- '-ansi -D_FILE_OFFSET_BITS=64' CMakeModules/CompilerChecks.cmake; then
            echo "the -ansi patch did not apply"
            exit 1
          fi

          # Cython will not take byte literals as these enum values. Same
          # reasoning: matched on the declaration, not on its line number.
          sed -i -E "s/(UNDEFINED) = b'u'/\1 = 117/;
                     s/(HEADER) = b'b'/\1 = 98/;
                     s/(EVENT) = b'e'/\1 = 101/;
                     s/(HISTOGRAM) = b'h'/\1 = 104/;
                     s/(RATE) = b'r'/\1 = 114/;
                     s/(HISTOGRAM_DEFINITION) = b'd'/\1 = 100/" \
            pyext/wrapper/cppdefs.pxd
          if grep -qE "= b'[ubehrd]'" pyext/wrapper/cppdefs.pxd; then
            echo "the cppdefs patches did not all apply:"
            grep -nE "= b'[ubehrd]'" pyext/wrapper/cppdefs.pxd
            exit 1
          fi

      - name: Build HAMMER
        if: steps.hammer-cache.outputs.cache-hit != 'true'
        run: |
          mkdir "$RUNNER_TEMP/Hammer-build"
          cd "$RUNNER_TEMP/Hammer-build"
          cmake -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/Hammer-install" \
                -DWITH_PYTHON=ON \
                -DINSTALL_EXTERNAL_DEPENDENCIES=ON \
                -DFORCE_YAMLCPP_INSTALL=ON \
                "$RUNNER_TEMP/Hammer"
          make -j"$(nproc)"
          make install

      - name: Install the HAMMER bindings
        run: |
          python -m pip install "$RUNNER_TEMP/Hammer-build/pyext"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/Hammer-install/lib:$RUNNER_TEMP/Hammer-install/lib64:$LD_LIBRARY_PATH" \
            >> "$GITHUB_ENV"

      - name: Install redist
        run: |
          python -m pip install uv
          uv pip install --system --upgrade -e ".[dev]"

      - name: Show installed packages
        run: pip list

      # Scoped to test/, not the whole rootdir. HAMMER is built outside the
      # workspace precisely so that its own suite cannot be collected, but
      # saying which directory holds our tests costs nothing and does not
      # depend on that staying true.
      - name: Run the tests
        run: pytest test/ -rs

      # A green run means nothing if the tests needing HAMMER skipped, which is
      # exactly what happens when the build quietly produced no usable bindings.
      - name: Fail if the hammer tests were skipped
        run: |
          pytest test/test_hammer_cacher.py -q --no-header -p no:cacheprovider \
            | tee /dev/stderr | grep -qE "[0-9]+ passed"
